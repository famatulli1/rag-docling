services:
  # FastAPI Web Application - Public facing service
  fastapi_web_app:
    build:
      context: .
      dockerfile: ./services/fastapi_web_app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RAG_SERVER_URL=http://rag-server:8001
    depends_on:
      - rag-server
    networks:
      - public
      - private
    volumes:
      - ./data/indexed_documents:/app/documents:ro

  # RAG Server - Core processing service
  rag-server:
    build:
      context: .
      dockerfile: ./services/rag_server/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CHROMADB_URL=http://chromadb:8000
      - OPENAI_BASE_URL=https://apigpt.mynumih.fr/v1
      - OLLAMA_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_MODEL=jpacifico/Chocolatine-2-14B-Instruct-v2.0.3
      - PROMPT_STRATEGY=balanced  # Options: fast, balanced, precise, comprehensive
      - RESPONSE_LANGUAGE=fr  # Options: fr, en
      # Vision & Image Description (SmolVLM-256M)
      - ENABLE_PICTURE_DESCRIPTION=true  # Enable/disable image description
      - PICTURE_DESCRIPTION_PROMPT=Décris cette image en français en quelques phrases.
      - PICTURE_AREA_THRESHOLD=0.01  # Minimum image size (1% of page)
      - PICTURE_BATCH_SIZE=1  # Number of images processed in parallel (reduced for 6GB GPU)
      # GPU Configuration
      - CUDA_VISIBLE_DEVICES=0  # Use first GPU for acceleration
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True  # Reduce memory fragmentation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chromadb
    networks:
      - private
      - public
    volumes:
      - ./data/indexed_documents:/app/documents
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ChromaDB Vector Database (private network only)
  chromadb:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_db_data:/chroma/chroma
    networks:
      - private
    restart: unless-stopped

# Network configuration for security isolation
networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true

# Persistent volumes
volumes:
  chroma_db_data:
    driver: local

 